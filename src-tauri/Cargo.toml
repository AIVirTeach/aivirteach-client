[package]
name = "aivirteach-desktop"
version = "0.1.0"
description = "Restricted desktop shell for the AIVirTeach learning workspace"
authors = ["AIVirTeach"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aivirteach_desktop_lib"
